{% extends "base.html" %}

{% block content %}
<div class="booking-container">
    <h2>Book Tickets: {{ event.name }}</h2>
    <div class="event-details">
        <p><strong>Date:</strong> {{ event.date }}</p>
        <p><strong>Venue:</strong> {{ event.venue }}</p>
        <p><strong>Tickets Available:</strong> {{ event.available_tickets }}</p>
    </div>

    <form method="POST" action="{{ url_for('main.book_ticket', event_id=event.id) }}" class="booking-form">
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" name="tickets" min="1" max="{{ event.available_tickets }}" value="1" required>
        </div>
        <button type="submit" class="btn">Confirm Booking</button>
    </form>
</div>
{% endblock %}
